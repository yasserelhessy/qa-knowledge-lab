[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-knowledge-lab"
version = "1.0.0"
description = "A synthetic QA knowledge assistant with reproducible regression gates"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langchain-core>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-playwright>=0.7,<1", "jsonschema>=4,<5"]
openai = ["langchain-openai>=1,<2"]

[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: browser tests requiring a running demo server"]
